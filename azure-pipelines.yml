trigger:
  branches:
    include:
      - main
      - master
      - develop

pr:
  branches:
    include:
      - main
      - master
      - develop

parameters:
  - name: azureServiceConnection
    displayName: Azure service connection for Playwright Workspaces
    type: string
    default: Playwright-Workspaces-ServiceConnection

  - name: grep
    displayName: Playwright grep filter
    type: string
    default: '@smoke'

  - name: workers
    displayName: Parallel workers for cloud execution
    type: string
    default: '10'

  - name: runUci
    displayName: Include UCI jobs
    type: string
    default: 'true'

  - name: runPreprod
    displayName: Include preprod jobs
    type: string
    default: 'false'

  - name: runLab
    displayName: Include lab jobs
    type: string
    default: 'false'

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'

stages:
  - stage: PlaywrightWorkspaces
    displayName: Playwright Workspaces Validation
    jobs:
      - job: Cinesa_Production
        displayName: Cinesa production
        variables:
          TEST_ENV: production
          PLAYWRIGHT_PROJECT: Cinesa
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js $(NODE_VERSION)
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          - task: AzureCLI@2
            displayName: Run Playwright cloud tests
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set +e
                export npm_config_cache="$(Pipeline.Workspace)/.npm"
                npm ci
                npm run report:clean:results
                export PLAYWRIGHT_SERVICE_URL="$(PLAYWRIGHT_SERVICE_URL)"
                export PLAYWRIGHT_RUN_ID="$(Build.BuildId)-$(System.JobName)"
                export TEST_ENV="$(TEST_ENV)"
                npx playwright test --config=playwright.service.config.ts --project="$(PLAYWRIGHT_PROJECT)" --workers=${{ parameters.workers }} --grep "${{ parameters.grep }}"
                exit_code=$?
                echo "##vso[task.setvariable variable=PLAYWRIGHT_EXIT_CODE]$exit_code"
                exit 0

          - script: |
              set -e
              npm run report:ci
            displayName: Generate Allure report
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: Publish Allure results
            condition: always()
            inputs:
              targetPath: .allure/results
              artifact: allure-results-cinesa-production

          - task: PublishPipelineArtifact@1
            displayName: Publish Allure HTML report
            condition: always()
            inputs:
              targetPath: .allure/report
              artifact: allure-report-cinesa-production

          - task: PublishPipelineArtifact@1
            displayName: Publish Playwright artifacts
            condition: always()
            inputs:
              targetPath: .allure/playwright-artifacts
              artifact: playwright-artifacts-cinesa-production

          - script: |
              exit_code="${PLAYWRIGHT_EXIT_CODE:-0}"
              exit "$exit_code"
            displayName: Fail job if tests failed
            condition: always()

      - job: UCI_Production
        displayName: UCI production
        condition: and(always(), eq('${{ parameters.runUci }}', 'true'))
        variables:
          TEST_ENV: production
          PLAYWRIGHT_PROJECT: UCI Cinemas
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Use Node.js $(NODE_VERSION)
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          - task: AzureCLI@2
            displayName: Run Playwright cloud tests
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set +e
                export npm_config_cache="$(Pipeline.Workspace)/.npm"
                npm ci
