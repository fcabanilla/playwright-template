            displayName: Fail job if tests failed
            condition: always()

      - job: Cinesa_Preprod
        displayName: Cinesa preprod
        condition: and(always(), eq('${{ parameters.runPreprod }}', 'true'))
        variables:
          TEST_ENV: preprod
          PLAYWRIGHT_PROJECT: Cinesa
